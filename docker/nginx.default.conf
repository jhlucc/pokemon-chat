server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static assets: do not fall back to index.html (otherwise missing chunks become HTML -> "Failed to fetch dynamically imported module").
  # Also allow long-term caching because Vite emits content-hashed filenames.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    # Avoid stale HTML causing mismatched chunk filenames after a redeploy.
    add_header Cache-Control "no-store";
  }

  # FastAPI OpenAPI schema is served at /openapi.json (app root), but Swagger UI
  # is commonly accessed through /api/docs (reverse proxy). Proxy this path so
  # Swagger UI can load the schema successfully.
  location = /openapi.json {
    proxy_pass http://api:5050/openapi.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Optional: expose FastAPI docs directly (helps OAuth redirect URL which points to /docs/* by default).
  location /docs/ {
    proxy_pass http://api:5050/docs/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }
  location = /docs {
    proxy_pass http://api:5050/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # Backend proxy (supports streaming responses)
  location /api/ {
    proxy_pass http://api:5050/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }
}
