services:
  api:
    container_name: pk-api
    image: pk-api
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "5050:5050"
    # Unify backend env: use repo root `.env` for both local dev and Docker.
    # Copy `.env.example` -> `.env` (repo root), then run `docker compose up`.
    env_file:
      - ../.env
    # Docker-internal endpoints override any localhost values from `.env`.
    environment:
      neo4j_uri: bolt://neo4j:7687
      milvus_uri: http://milvus:19530
      mysql_host: mysql
      mysql_port: 3306
      mcp_sse_url: http://mcp:8000/sse
      funasr_url: ws://funasr:10095
      # Required for LangChain Neo4jGraph when NEO4J_AUTH=none (ignored by Neo4j)
      NEO4J_PASSWORD: "not-used"

    volumes:
      # Persist runtime state (agentic memory / checkpoints / uploads).
      # Use repo-owned `resources/save` to avoid root-owned bind-mount dirs created by Docker
      # (which would make the container's non-root user unable to write).
      - ../resources/save:/app/resources/save
      # Read-only data mounted from the repo (kg/map/ner/etc). Required for bootstrap scripts.
      - ../resources/data:/app/resources/data:ro
    networks:
      - vector-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    container_name: pk-web
    image: pk-web
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - vector-net

  mcp:
    profiles: ["mcp"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: ["python", "-m", "src.mcp.mcp_server"]
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      mysql_host: mysql
      mysql_port: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vector-net

  neo4j:
    profiles: ["infra"]
    image: neo4j:5.14.0
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
#      - NEO4J_AUTH=neo4j/tczaslw278
      - NEO4J_AUTH=none
      - NEO4J_PLUGINS=["apoc"]  # ✅ 启用 APOC 插件
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.meta.data,apoc.coll.*,apoc.load.*
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - vector-net

  # One-shot bootstrap: import `resources/data/kg_data` into Neo4j.
  # Safe to re-run: the script will skip if the marker node exists.
  neo4j-bootstrap:
    profiles: ["infra"]
    image: pk-api
    pull_policy: never
    restart: "no"
    command: ["python", "scripts/import_graph.py", "--wait-seconds", "120"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ""
      KG_BOOTSTRAP_MARKER_ID: pokemon-chat-kg-v1
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ../resources/data:/app/resources/data:ro
    networks:
      - vector-net

  etcd:
    profiles: ["infra"]
    image: quay.io/coreos/etcd:v3.5.5
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    # NOTE: advertise-client-urls must be reachable by other containers.
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ./volumes/milvus/etcd:/etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vector-net

  minio:
    profiles: ["infra"]
    image: minio/minio:RELEASE.2023-09-20T22-49-55Z
    restart: always
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: minio server /data
    volumes:
      - ./volumes/milvus/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vector-net
  mysql:
    profiles: ["infra"]
    image: mysql:5.7
    container_name: mysql-pokemon
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: langgraph
      MYSQL_USER: jhlu
      MYSQL_PASSWORD: 123456
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vector-net

  milvus:
    profiles: ["infra"]
    image: milvusdb/milvus:v2.3.0
    restart: always
    command: [ "milvus", "run", "standalone" ]
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "19091:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MILVUS_LOG_LEVEL=error
    volumes:
      - ./volumes/milvus/milvus:/var/lib/milvus
      - ./volumes/milvus/logs:/var/lib/milvus/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vector-net
  funasr:
    profiles: ["asr"]
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-cpu-0.4.5
    restart: always
    ports:
      - "10095:10095"
    command: >
      bash -c "cd /workspace/FunASR/runtime &&
      nohup bash run_server.sh
      --download-model-dir /workspace/models
      --model-dir damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-onnx
      --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx
      --punc-dir damo/punc_ct-transformer_zh-cn-common-vocab272727-onnx
      --itn-dir thuduj12/fst_itn_zh
      --certfile 0
      --hotword /workspace/hotwords.txt 2>&1 | tee /workspace/server.log"
    volumes:
      - ./volumes/funasr/models:/workspace/models
    networks:
      - vector-net

networks:
  vector-net:
    driver: bridge

volumes:
  mysql-data:
