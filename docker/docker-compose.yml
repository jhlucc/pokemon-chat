services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - .env
    # Compose loads variables from docker/.env (if present). You can also export them in your shell.
    environment:
      # ---- Feature flags (safe defaults) ----
      enable_knowledge_base: ${enable_knowledge_base:-false}
      enable_knowledge_graph: ${enable_knowledge_graph:-false}
      enable_web_search: ${enable_web_search:-false}
      enable_mcp: ${enable_mcp:-false}
      enable_reranker: ${enable_reranker:-false}
      enable_ner_bert: ${enable_ner_bert:-false}
      enable_asr: ${enable_asr:-false}

      # ---- LLM ----
      llm_api_key: ${llm_api_key:-}
      llm_api_base: ${llm_api_base:-https://api.siliconflow.cn/v1}
      llm_model_name: ${llm_model_name:-Qwen/Qwen2.5-7B-Instruct}
      llm_temperature: ${llm_temperature:-0.7}
      llm_max_tokens: ${llm_max_tokens:-4096}

      # ---- Embedding ----
      embedding_provider: ${embedding_provider:-siliconflow}
      embedding_api_key: ${embedding_api_key:-}
      embedding_api_base: ${embedding_api_base:-https://api.siliconflow.cn/v1/embeddings}
      embedding_model_name: ${embedding_model_name:-BAAI/bge-m3}
      embedding_dimension: ${embedding_dimension:-1024}

      # ---- Reranker ----
      reranker_enabled: ${reranker_enabled:-true}
      reranker_api_key: ${reranker_api_key:-}
      reranker_api_base: ${reranker_api_base:-https://api.siliconflow.cn/v1}
      reranker_model_name: ${reranker_model_name:-BAAI/bge-reranker-v2-m3}
      reranker_top_k: ${reranker_top_k:-10}
      reranker_threshold: ${reranker_threshold:-0.1}

      # ---- Databases (docker-internal defaults) ----
      neo4j_uri: bolt://neo4j:7687
      neo4j_username: ${neo4j_username:-neo4j}
      neo4j_password: ${neo4j_password:-}

      milvus_uri: http://milvus:19530

      mysql_host: mysql
      mysql_port: 3306
      mysql_user: ${mysql_user:-root}
      mysql_password: ${mysql_password:-123456}
      mysql_database: ${mysql_database:-langgraph}

      # ---- MCP ----
      mcp_sse_url: http://mcp:8000/sse
      funasr_url: ${funasr_url:-ws://funasr:10095}

      # ---- Web search ----
      tavily_api_key: ${tavily_api_key:-}

      # ---- CORS ----
      cors_allow_origins: ${cors_allow_origins:-*}
      cors_allow_credentials: ${cors_allow_credentials:-true}

      # ---- Provider keys (legacy auto-detection compatibility) ----
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

    volumes:
      - ./volumes/app/save:/app/resources/save
    networks:
      - vector-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - vector-net

  mcp:
    profiles: ["mcp"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: ["python", "-m", "src.mcp.mcp_server"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      mysql_host: mysql
      mysql_port: 3306
      mysql_user: ${mysql_user:-root}
      mysql_password: ${mysql_password:-123456}
      mysql_database: ${mysql_database:-langgraph}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vector-net

  neo4j:
    profiles: ["infra"]
    image: neo4j:5.14.0
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
#      - NEO4J_AUTH=neo4j/tczaslw278
      - NEO4J_AUTH=none
      - NEO4J_PLUGINS=["apoc"]  # ✅ 启用 APOC 插件
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.meta.data,apoc.coll.*,apoc.load.*
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/var/lib/neo4j/logs
    networks:
      - vector-net

  etcd:
    profiles: ["infra"]
    image: quay.io/coreos/etcd:v3.5.5
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    # NOTE: advertise-client-urls must be reachable by other containers.
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ./volumes/milvus/etcd:/etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vector-net

  minio:
    profiles: ["infra"]
    image: minio/minio:RELEASE.2023-09-20T22-49-55Z
    restart: always
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: minio server /data
    volumes:
      - ./volumes/milvus/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vector-net
  mysql:
    profiles: ["infra"]
    image: ${MYSQL_IMAGE:-mysql:5.7}
    container_name: mysql-pokemon
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: langgraph
      MYSQL_USER: jhlu
      MYSQL_PASSWORD: 123456
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vector-net

  milvus:
    profiles: ["infra"]
    image: milvusdb/milvus:v2.3.0
    restart: always
    command: [ "milvus", "run", "standalone" ]
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "19091:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MILVUS_LOG_LEVEL=error
    volumes:
      - ./volumes/milvus/milvus:/var/lib/milvus
      - ./volumes/milvus/logs:/var/lib/milvus/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vector-net
  funasr:
    profiles: ["infra"]
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-cpu-0.4.5
    restart: always
    ports:
      - "10095:10095"
    command: >
      bash -c "cd /workspace/FunASR/runtime && 
      nohup bash run_server.sh 
      --download-model-dir /workspace/models 
      --model-dir damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-onnx
      --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx
      --punc-dir damo/punc_ct-transformer_zh-cn-common-vocab272727-onnx
      --itn-dir thuduj12/fst_itn_zh
      --certfile 0
      --hotword /workspace/hotwords.txt 2>&1 | tee /workspace/server.log"
    volumes:
      - ./volumes/funasr/models:/workspace/models
    networks:
      - vector-net

networks:
  vector-net:
    driver: bridge
