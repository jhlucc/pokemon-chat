repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint + fix)
        entry: python -m ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff (format)
        entry: python -m ruff format
        language: system
        types: [python]

      - id: web-lint
        name: web (eslint)
        entry: npm --prefix web run lint
        language: system
        pass_filenames: false

      - id: web-typecheck
        name: web (vue-tsc)
        entry: npm --prefix web run typecheck
        language: system
        pass_filenames: false

